[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mate"
version = "0.1.0"
description = "Run repetitive operations across multiple project folders."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "requests",
    "colorama",
    "tomli-w",
    "gitpython",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
mate = "mate.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-m 'not npp'"
markers = [
    "e2e: end-to-end tests that drive mate against a temporary workspace",
    "git: tests that require git on PATH",
    "npp: tests that open the real Notepad++ (opt-in: pytest -m npp)",
    "smoke: tests that run mate as a real subprocess (python -m mate)",
]