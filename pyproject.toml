[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mate"
version = "0.1.0"
description = "Run repetitive operations across multiple project folders."
readme = "README.md"
requires-python = ">=3.10"

dependencies = ["requests", "colorama"]

[project.scripts]
mate = "mate.main:cli"

[tool.setuptools.packages.find]
where = ["src"]